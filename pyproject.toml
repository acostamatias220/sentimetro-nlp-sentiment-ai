[project]
name = "sentimetro"
version = "0.1.0"
description = "End-to-end ML pipeline for sentiment classification of Spanish product reviews: data, training (TF-IDF baseline + fine-tuned DistilBETO), MLflow tracking, ONNX export and a FastAPI service."
readme = "README.md"
license = "MIT"
authors = [{ name = "Matías Acosta" }]
requires-python = ">=3.11,<3.14"
# Runtime dependencies: just what the inference service needs (no torch).
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "onnxruntime>=1.18",
  "tokenizers>=0.20",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
# Everything needed to download data, train, evaluate and export models.
train = [
  "torch>=2.6",
  "transformers>=4.46",
  "accelerate>=1.0",
  "datasets>=3.0",
  "mlflow>=2.16",
  "pandas>=2.2",
  "pyarrow>=16",
  "matplotlib>=3.9",
  "onnx>=1.16",
  "onnxscript>=0.1",
]

[project.scripts]
sentimetro = "sentimetro.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentimetro"]

# CPU-only PyTorch wheels (much smaller). On a GPU machine remove this source
# or point it at the CUDA index that matches your driver.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "PL", "PT", "C4", "RET"]
ignore = [
  "PLR0913", # many arguments is fine for training entrypoints
  "PLR2004", # magic values in tests and thresholds
  "RUF001",  # Spanish text contains ambiguous-looking unicode characters on purpose
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unused_ignores = true
pretty = true

[[tool.mypy.overrides]]
module = [
  "sklearn.*",
  "joblib.*",
  "onnxruntime.*",
  "datasets.*",
  "mlflow.*",
  "matplotlib.*",
  "pandas.*",
  "pyarrow.*",
  "onnx.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: tests that build a tiny transformer and export it to ONNX (need the train extra)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["sentimetro"]
omit = ["src/sentimetro/cli.py"]
